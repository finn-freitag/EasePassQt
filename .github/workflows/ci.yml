name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure
        run: nix develop --command cmake --preset linux-debug

      - name: Build
        run: nix develop --command cmake --build --preset linux-debug

      - name: Test
        run: nix develop --command ctest --preset linux-debug

      - name: Nix package build (runs unit tests)
        run: nix build -L .#easepass

  windows:
    name: Windows (MSVC + vcpkg)
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Must stay >= EASEPASS_QT_MIN_VERSION (CMakeLists.txt). Pinned to the version the
          # Nix build uses (nixos-unstable, flake.lock) so both platforms test the same Qt.
          version: "6.11.2"
          arch: win64_msvc2022_64
          modules: qtmultimedia  # qtdeclarative (Qt Quick) ships with the base install
          cache: true
          # Qt >= 6.11 moved the Windows packages into one repository folder per compiler
          # (qt6_6112/qt6_6112_msvc2022_64/). aqtinstall 3.3.0, the latest release, does not
          # know that layout ("Failed to locate XML data for Qt version"); the fix
          # (miurahr/aqtinstall#1000) is merged but unreleased. Pinned to a reviewed master
          # commit; switch back to `aqtversion: "==3.4.*"` once 3.4.0 is on PyPI.
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7"

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc

      - name: Test
        run: ctest --preset windows-msvc
